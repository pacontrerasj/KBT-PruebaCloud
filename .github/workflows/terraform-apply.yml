name: "Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/.terraform.lock.hcl'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TF_VAR_email_sns: ${{ secrets.EMAIL_SNS }}

jobs:
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ./environments/dev
        run: terraform init

      - name: Terraform Validate
        working-directory: ./environments/dev
        run: terraform validate

      - name: Terraform Format
        working-directory: ./environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        working-directory: ./environments/dev
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./environments/dev
        run: terraform apply -auto-approve tfplan

      - name: Get ECR Repository URL
        id: ecr
        working-directory: ./environments/dev
        run: echo "url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        env:
          ECR_URL: ${{ steps.ecr.outputs.url }}
          APP_VERSION: v1.0.0
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_URL
          docker build -t technova-web .
          docker tag technova-web $ECR_URL:$APP_VERSION
          docker push $ECR_URL:$APP_VERSION